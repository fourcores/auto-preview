name: Preview (reusable)

# Label-driven PR preview environments.
#
# The label is STATE, not an event:
#   - PR has the label         -> a preview should be running (built from the PR head commit)
#   - label removed / PR closed -> the preview is torn down
#   - push while labelled      -> the preview is rebuilt
# Extra labels of the form "<label>:<name>" activate the compose profile <name>.
#
# Call this from a thin workflow in the consuming repo (see template/). The caller
# must NOT define its own concurrency group for the calling job: this workflow
# owns the per-PR group and a clash cancels the called jobs.

on:
  workflow_call:
    inputs:
      expose:
        description: >-
          Services to publish through Cloudflare Quick Tunnels, as name:port pairs,
          e.g. "frontend:3000,api:8000". Each service must publish that port on the
          host in the compose file. Names become PREVIEW_URL_<NAME> variables.
        type: string
        required: true
      compose-file:
        description: Path to the compose file, relative to the repo root.
        type: string
        default: .preview/docker-compose.yml
      label:
        description: Label that requests a preview. "<label>:<name>" activates compose profile <name>.
        type: string
        default: preview
      ttl-minutes:
        description: How long a preview stays up before it expires (5-330).
        type: number
        default: 120
      start-timeout-seconds:
        description: How long `docker compose up --wait` may take (build time not included in the wait, but a slow healthcheck counts).
        type: number
        default: 600
      runner:
        description: Runner label for the job that hosts the stack (must be linux/x86_64).
        type: string
        default: ubuntu-latest
    secrets:
      PREVIEW_ENV:
        description: >-
          Optional dotenv-style secret (KEY=value lines). Used for compose variable
          interpolation and exposed to services as the file ${PREVIEW_ENV_FILE}.
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  # cloudflared is pinned and checksum-verified. Bump both together.
  CLOUDFLARED_VERSION: "2026.9.3"
  CLOUDFLARED_SHA256: "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2"
  STICKY_MARKER: "<!-- auto-preview:sticky -->"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # gate: turn "what just happened to the PR" into deploy | teardown | none
  # Irrelevant events (other labels, pushes to unlabelled PRs, fork PRs) skip
  # this job entirely, so they never cost a runner or touch the concurrency group.
  # ───────────────────────────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action == 'closed' ||
        (contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
         contains(github.event.pull_request.labels.*.name, inputs.label)) ||
        (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
         (github.event.label.name == inputs.label ||
          startsWith(github.event.label.name, format('{0}:', inputs.label))))
      )
    outputs:
      action: ${{ steps.decide.outputs.action }}
      profiles: ${{ steps.decide.outputs.profiles }}
      short-sha: ${{ steps.decide.outputs.short-sha }}
    steps:
      - name: Decide what to do
        id: decide
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_STATE: ${{ github.event.pull_request.state }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          LABEL: ${{ inputs.label }}
          EXPOSE: ${{ inputs.expose }}
          TTL: ${{ inputs.ttl-minutes }}
        run: |
          set -euo pipefail

          has_label=$(jq --arg l "$LABEL" 'index($l) != null' <<<"$LABELS")

          action=none
          if [ "$EVENT_ACTION" = "closed" ]; then
            action=teardown
          elif [ "$PR_STATE" != "open" ]; then
            action=none
          elif [ "$has_label" = "true" ]; then
            action=deploy
          elif [ "$EVENT_ACTION" = "unlabeled" ] && [ "$EVENT_LABEL" = "$LABEL" ]; then
            action=teardown
          fi

          profiles=""
          short_sha="${HEAD_SHA:0:7}"

          if [ "$action" = "deploy" ]; then
            # These come from the integrator, not the PR author: fail loudly.
            if ! [[ "$EXPOSE" =~ ^[a-z][a-z0-9-]*:[0-9]{2,5}(,[a-z][a-z0-9-]*:[0-9]{2,5})*$ ]]; then
              echo "::error title=Invalid 'expose' input::Expected name:port[,name:port...], e.g. frontend:3000,api:8000"
              exit 1
            fi
            if [ -n "$(tr ',' '\n' <<<"$EXPOSE" | cut -d: -f1 | sort | uniq -d)" ]; then
              echo "::error title=Invalid 'expose' input::Service names must be unique"
              exit 1
            fi
            if ! [[ "$TTL" =~ ^[0-9]+$ ]] || (( TTL < 5 || TTL > 330 )); then
              echo "::error title=Invalid 'ttl-minutes' input::Must be an integer between 5 and 330"
              exit 1
            fi

            # Profile labels ("<label>:<name>") are set by whoever can label the PR,
            # so only pass through names that are safe to hand to compose.
            while IFS= read -r p; do
              if [ -z "$p" ]; then
                continue
              fi
              if [[ "$p" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
                profiles+="${profiles:+,}$p"
              else
                echo "::warning::Ignoring a profile label with unsupported characters"
              fi
            done < <(jq -r --arg p "$LABEL:" '.[] | select(startswith($p)) | .[($p | length):]' <<<"$LABELS")
          fi

          echo "Decision: $action (profiles: ${profiles:-none})"
          {
            echo "action=$action"
            echo "profiles=$profiles"
            echo "short-sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # up: build the stack on the runner, expose it, post the URLs, stay alive
  # until the TTL ends. Cancelled (by a newer deploy or a teardown) via the
  # per-PR concurrency group; the VM is discarded, so nothing needs cleaning up.
  # ───────────────────────────────────────────────────────────────────────────
  up:
    needs: gate
    if: needs.gate.outputs.action == 'deploy'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: auto-preview-${{ github.repository }}-pr-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Find existing preview comment
        id: find
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.STICKY_MARKER }}

      - name: Comment - building
        id: building
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          edit-mode: replace
          body: |
            <!-- auto-preview:sticky -->
            <!-- auto-preview:state=building -->
            ## Preview environment

            **Building** commit `${{ needs.gate.outputs.short-sha }}` (profiles: ${{ needs.gate.outputs.profiles || 'none' }}).
            The URLs will appear here when it is ready.

            > [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare environment files
        env:
          PREVIEW_ENV: ${{ secrets.PREVIEW_ENV }}
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
          PROFILES: ${{ needs.gate.outputs.profiles }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077

          if [ ! -f "$COMPOSE_FILE_INPUT" ]; then
            echo "::error title=Compose file not found::'$COMPOSE_FILE_INPUT' does not exist in the PR head"
            exit 1
          fi

          SECRETS_FILE="$RUNNER_TEMP/preview.secrets.env"
          URLS_FILE="$RUNNER_TEMP/preview.urls.env"

          printf '%s\n' "$PREVIEW_ENV" > "$SECRETS_FILE"

          # Multi-line secrets are not masked line by line, so mask each value.
          # Very short values are skipped: masking "true" or "5432" ruins the logs.
          while IFS= read -r line; do
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            if [ "$value" != "$line" ] && [ "${#value}" -ge 6 ]; then
              echo "::add-mask::$value"
            fi
          done <<<"$PREVIEW_ENV"

          {
            echo "PREVIEW_ENV_FILE=$SECRETS_FILE"
            echo "PREVIEW_PR_NUMBER=$PR_NUMBER"
            echo "PREVIEW_SHA=$HEAD_SHA"
          } > "$URLS_FILE"

          {
            echo "COMPOSE_FILE=$COMPOSE_FILE_INPUT"
            echo "COMPOSE_PROJECT_NAME=preview"
            echo "COMPOSE_ENV_FILES=$SECRETS_FILE,$URLS_FILE"
            echo "COMPOSE_PROFILES=$PROFILES"
          } >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error title=Unsupported runner::auto-preview currently supports linux/x86_64 runners only"
            exit 1
          fi
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

      # Tunnels start BEFORE the stack: Quick Tunnel hostnames are assigned up
      # front, so every service can be configured with its final public URL on
      # first boot (no restarts). Tunnels answer 502 until the origin is up.
      - name: Start tunnels
        id: tunnels
        env:
          EXPOSE: ${{ inputs.expose }}
          TTL: ${{ inputs.ttl-minutes }}
        run: |
          set -euo pipefail
          URLS_FILE="$RUNNER_TEMP/preview.urls.env"

          IFS=',' read -ra entries <<<"$EXPOSE"
          for entry in "${entries[@]}"; do
            name="${entry%%:*}"
            port="${entry##*:}"
            nohup cloudflared tunnel --no-autoupdate \
              --url "http://localhost:${port}" \
              --logfile "$RUNNER_TEMP/cloudflared-${name}.log" \
              >/dev/null 2>&1 &
          done

          table="| Service | URL |"$'\n'"|---|---|"
          for entry in "${entries[@]}"; do
            name="${entry%%:*}"
            log="$RUNNER_TEMP/cloudflared-${name}.log"
            url=""
            for _ in $(seq 1 45); do
              # "api.trycloudflare.com" shows up in error lines; it is not our tunnel.
              url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$log" 2>/dev/null \
                    | grep -v '^https://api\.' | head -1 || true)
              [ -n "$url" ] && break
              sleep 2
            done
            if [ -z "$url" ]; then
              echo "::error title=Tunnel failed::No tunnel URL for '$name'"
              cat "$log" || true
              exit 1
            fi
            var="${name^^}"; var="${var//-/_}"
            echo "PREVIEW_URL_${var}=${url}" >> "$URLS_FILE"
            table+=$'\n'"| ${name} | ${url} |"
            echo "Tunnel ${name}: ${url}"
          done

          {
            echo "table<<AUTO_PREVIEW_EOF"
            echo "$table"
            echo "AUTO_PREVIEW_EOF"
            echo "expires=$(date -u -d "+${TTL} minutes" '+%H:%M UTC')"
          } >> "$GITHUB_OUTPUT"

      - name: Start the stack
        env:
          WAIT_TIMEOUT: ${{ inputs.start-timeout-seconds }}
        run: docker compose up --detach --build --wait --wait-timeout "$WAIT_TIMEOUT"

      - name: Wait for the public URLs to respond
        run: |
          set -euo pipefail
          while IFS='=' read -r key url; do
            case "$key" in PREVIEW_URL_*) ;; *) continue ;; esac
            ok=false
            for _ in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              if [[ "$code" =~ ^[234] ]]; then ok=true; break; fi
              sleep 3
            done
            if [ "$ok" != "true" ]; then
              echo "::error title=Not reachable::$url never returned a non-5xx response (last status: $code)"
              exit 1
            fi
            echo "$key is up ($code)"
          done < "$RUNNER_TEMP/preview.urls.env"

      - name: Comment - ready
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.building.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          edit-mode: replace
          body: |
            <!-- auto-preview:sticky -->
            <!-- auto-preview:state=live -->
            ## Preview environment

            ${{ steps.tunnels.outputs.table }}

            Commit `${{ needs.gate.outputs.short-sha }}` · profiles: ${{ needs.gate.outputs.profiles || 'none' }} · expires about ${{ steps.tunnels.outputs.expires }}

            > Pushing a commit rebuilds it. Remove the `${{ inputs.label }}` label to stop it early.
            > [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Keep alive until the TTL ends
        env:
          TTL: ${{ inputs.ttl-minutes }}
        run: |
          end=$(( $(date +%s) + TTL * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 30
          done
          echo "TTL reached; shutting down."

      - name: Comment - expired
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.building.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          edit-mode: replace
          body: |
            <!-- auto-preview:sticky -->
            <!-- auto-preview:state=expired -->
            ## Preview environment

            **Expired.** The URLs no longer resolve.
            Remove and re-add the `${{ inputs.label }}` label (or push a commit while it is applied) to start a fresh one.

            > [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # failure() is false when the job was cancelled, so a teardown or a newer
      # deploy never triggers these.
      - name: Dump logs
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail 200 || true
          for f in "$RUNNER_TEMP"/cloudflared-*.log; do
            echo "::group::$f"; tail -n 50 "$f" || true; echo "::endgroup::"
          done

      - name: Comment - failed
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.building.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          edit-mode: replace
          body: |
            <!-- auto-preview:sticky -->
            <!-- auto-preview:state=failed -->
            ## Preview environment

            **Failed to start** for commit `${{ needs.gate.outputs.short-sha }}`. The workflow run has the container logs.
            Fix it and push, or remove and re-add the `${{ inputs.label }}` label to retry.

            > [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ───────────────────────────────────────────────────────────────────────────
  # teardown: joining the same concurrency group is what stops the running
  # preview; this job only updates the comment. It does nothing if no preview
  # was ever started for the PR.
  # ───────────────────────────────────────────────────────────────────────────
  teardown:
    needs: gate
    if: needs.gate.outputs.action == 'teardown'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: auto-preview-${{ github.repository }}-pr-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Find preview comment
        id: find
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.STICKY_MARKER }}

      # Only rewrite comments that still claim to be building or live.
      - name: Comment - stopped
        if: >-
          steps.find.outputs.comment-id != '' &&
          (contains(steps.find.outputs.comment-body, 'auto-preview:state=live') ||
           contains(steps.find.outputs.comment-body, 'auto-preview:state=building'))
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          edit-mode: replace
          body: |
            <!-- auto-preview:sticky -->
            <!-- auto-preview:state=stopped -->
            ## Preview environment

            **Stopped** (${{ github.event.action == 'closed' && 'the PR was closed' || 'the label was removed' }}).
            Add the `${{ inputs.label }}` label to start a new one.

            > [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
